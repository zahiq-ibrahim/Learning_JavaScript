<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <title>Calculator</title>
  </head>
  <body>
    <main class="container">
      <div class="calc-container">
        <h2 id="prev-op"></h2>
        <h1 id="output"></h1>
        
          <button class="grey3 btn">&lt;x</button>
          <button class="grey3 btn">AC</button>
          <button class="grey3 btn">%</button>
          <button class="orange5 btn">/</button>
        
 
          <button class="black3 btn">7</button>
          <button class="black3 btn">8</button>
          <button class="black3 btn">9</button>
          <button class="orange5 btn">X</button>
        
        
          <button class="black3 btn">4</button>
          <button class="black3 btn">5</button>
          <button class="black3 btn">6</button>
          <button class="orange5 btn">-</button>
        
        
          <button class="black3 btn">1</button>
          <button class="black3 btn">2</button>
          <button class="black3 btn">3</button>
          <button class="orange5 btn">+</button>
        
          <button class="black3 btn">+/-</button>
          <button class="black3 btn">0</button>
          <button class="black3 btn">.</button>
          <button class="orange5 btn">=</button>
        
      </div>
    </main>
  </body>
</html>
